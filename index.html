        let deletedFacilities = [];
        let allRoutes = [];
        let displayedRoutes = [];

        function generateOptimizedRoutes() {
            const routes = [];
            const areaGroups = {};
            
            allFacilities.forEach(facility => {
                if (!areaGroups[facility.area]) {
                    areaGroups[facility.area] = [];
                }
                areaGroups[facility.area].push(facility);
            });
            
            let routeNum = 1;
            const areasInOrder = ['北区', '中区', '東区', '南区'];
            
            areasInOrder.forEach(area => {
                const facilities = areaGroups[area] || [];
                const itemsPerRoute = 18;
                
                for (let i = 0; i < facilities.length; i += itemsPerRoute) {
                    const routeFacilities = facilities.slice(i, i + itemsPerRoute);
                    routes.push({
                        number: routeNum,
                        facilities: routeFacilities,
                        area: area,
                        createdDate: new Date().toLocaleDateString('ja-JP'),
                        status: '未実施'
                    });
                    routeNum++;
                }
            });
            
            return routes;
        }
        
        function updateDisplay() {
            updateStats();
            renderRoutes();
            renderDeletedList();
        }
        
        function updateStats() {
            document.getElementById('totalCount').textContent = allFacilities.length;
            document.getElementById('remainCount').textContent = allFacilities.length;
            document.getElementById('deletedCount').textContent = deletedFacilities.length;
            document.getElementById('routeCount').textContent = allRoutes.length;
        }
        
        function renderRoutes() {
            const container = document.getElementById('routesContainer');
            container.innerHTML = displayedRoutes.map((route) => {
                return `
                    <div class="route-card">
                        <div class="route-header">
                            <span class="route-number">ルート #${String(route.number).padStart(2, '0')}</span>
                            <span class="route-status">${route.facilities.length}件</span>
                        </div>
                        <div class="route-body">
                            <div class="route-info">
                                <div class="route-info-item">
                                    <span class="route-info-label">地域</span>
                                    <span class="route-info-value">${route.area}</span>
                                </div>
                                <div class="route-info-item">
                                    <span class="route-info-label">実施状況</span>
                                    <span class="route-info-value">${route.status}</span>
                                </div>
                            </div>
                            
                            <div class="facilities-list">
                                ${route.facilities.map((facility, idx) => {
                                    const typeLabel = facility.type === 'hospital' ? '病' : facility.type === 'residential' ? '居' : '相';
                                    const facilityIndex = allFacilities.indexOf(facility);
                                    return `
                                        <div class="facility-item">
                                            <div class="facility-content">
                                                <div class="facility-name">${facility.name}</div>
                                                <div class="facility-addr">${facility.addr}</div>
                                                <div class="facility-tel">${facility.tel}</div>
                                                <span class="facility-badge">${typeLabel}</span>
                                            </div>
                                            <div class="facility-actions">
                                                <button class="btn-delete-item" onclick="deleteFacility(${facilityIndex}, '${facility.name}')" title="この施設を除外">✕</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            
                            <div class="route-actions">
                                <button class="btn btn-small" onclick="exportRoute(${route.number})"><i class="fas fa-download"></i> CSV</button>
                                <button class="btn btn-small" onclick="markAsCompleted(${route.number})"><i class="fas fa-check"></i> 完了</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderDeletedList() {
            const deletedBox = document.getElementById('deletedBox');
            
            if (deletedFacilities.length === 0) {
                deletedBox.innerHTML = '';
                return;
            }
            
            deletedBox.innerHTML = `
                <div class="deleted-list">
                    <strong><i class="fas fa-trash-alt"></i> 除外施設（${deletedFacilities.length}件）</strong>
                    ${deletedFacilities.map((facility, idx) => `
                        <div class="deleted-item">
                            <span class="deleted-name">${facility.name}</span>
                            <button class="restore-btn" onclick="restoreFacility(${idx})">復元</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        function deleteFacility(facilityIndex, facilityName) {
            if (confirm(`「${facilityName}」を除外しますか？`)) {
                const facility = allFacilities[facilityIndex];
                deletedFacilities.push(facility);
                allFacilities.splice(facilityIndex, 1);
                
                allRoutes = generateOptimizedRoutes();
                displayedRoutes = [...allRoutes];
                
                showAlert(`${facilityName}を除外しました`, 'warning');
                updateDisplay();
            }
        }
        
        function restoreFacility(deletedIndex) {
            const facility = deletedFacilities[deletedIndex];
            if (confirm(`「${facility.name}」を復元しますか？`)) {
                allFacilities.push(facility);
                deletedFacilities.splice(deletedIndex, 1);
                
                allRoutes = generateOptimizedRoutes();
                displayedRoutes = [...allRoutes];
                
                showAlert(`${facility.name}を復元しました`, 'success');
                updateDisplay();
            }
        }
        
        function markAsCompleted(routeNumber) {
            const route = displayedRoutes.find(r => r.number === routeNumber);
            if (route) {
                route.status = '✅ 完了 (' + new Date().toLocaleDateString('ja-JP') + ')';
                updateDisplay();
                showAlert('ルート #' + String(routeNumber).padStart(2, '0') + ' が完了しました！', 'success');
            }
        }
        
        function filterRoutes() {
            const area = document.getElementById('filterArea').value;
            const type = document.getElementById('filterType').value;
            const search = document.getElementById('searchRoute').value.toLowerCase();
            
            displayedRoutes = allRoutes.filter(route => {
                const matchRoute = !search || route.number.toString().includes(search);
                const matchFacilities = route.facilities.some(f => {
                    return (!area || f.area === area) && (!type || f.type === type);
                });
                return matchRoute && matchFacilities;
            });
            
            renderRoutes();
        }
        
        function exportRoute(routeNumber) {
            const route = allRoutes.find(r => r.number === routeNumber);
            if (!route) return;
            
            let csv = 'ルート番号,順序,施設名,タイプ,エリア,住所,電話\n';
            route.facilities.forEach((f, idx) => {
                csv += `${route.number},${idx + 1},"${f.name}","${f.type}","${f.area}","${f.addr}","${f.tel}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `ルート_${String(routeNumber).padStart(2, '0')}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showAlert('CSVをダウンロードしました', 'success');
        }
        
        function exportData() {
            let csv = 'ルート番号,エリア,施設数,施設名,タイプ,住所,電話\n';
            allRoutes.forEach(route => {
                route.facilities.forEach((f, idx) => {
                    csv += `${route.number},"${route.area}",${route.facilities.length},"${f.name}","${f.type}","${f.addr}","${f.tel}"\n`;
                });
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', '全営業ルート_' + new Date().toLocaleDateString('ja-JP') + '.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showAlert('全体CSVがダウンロードされました', 'success');
        }
        
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}</div>`;
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 3000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            allRoutes = generateOptimizedRoutes();
            displayedRoutes = [...allRoutes];
            updateDisplay();
        });
    </script>
